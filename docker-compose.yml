services:
  postgres:
    image: postgres:17-alpine
    container_name: agrocontrol-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agrocontrol}
      POSTGRES_USER: ${POSTGRES_USER:-agrocontrol}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agrocontrol_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:

